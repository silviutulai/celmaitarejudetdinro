services:
  - type: web
    name: cel-mai-tare-judet
    env: python
    plan: starter          # NU "free" - vezi README, sectiunea despre Render
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ADMIN_PASSWORD
        sync: false
      - key: EULERSTREAM_API_KEY
        sync: false
      - key: MEGA_GIFT_THRESHOLD
        value: "99"
      - key: RARE_THRESHOLD
        value: "10"
      - key: EPIC_THRESHOLD
        value: "30"
      - key: MAX_COMMENTS_PER_USER
        value: "10"
      - key: STATE_FILE
        value: /var/data/state.json
    disk:
      name: scor-live
      mountPath: /var/data
      sizeGB: 1