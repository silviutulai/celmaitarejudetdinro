<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cel mai tare județ din România</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Space+Grotesk:wght@500;700&family=Baloo+2:wght@700;800&family=Inter:wght@500;600;700;800&family=Teko:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="stage-wrap" id="stageWrap">
<div class="stage">

  <div class="status-pill" id="statusPill">
    <span class="dot"></span>
    <span id="statusLabel">OFFLINE</span>
    <span class="viewers"><span id="viewersCount">0</span> 👁</span>
  </div>

  <div class="titlebar">
    <span class="tline"></span>
    <h1>CEL MAI TARE JUDEȚ DIN ROMÂNIA</h1>
    <span class="tline right"></span>
  </div>

  <div class="supporters-bar" id="supportersBar"></div>
  <div class="counties-bar" id="countiesBar"></div>

  <div class="map-wrap">
    <svg id="map-svg" viewBox="0 0 612.36395 432.29416" xmlns="http://www.w3.org/2000/svg">
      <g id="path-group"></g>
    </svg>
    <div class="buc-circle" id="bucCircle">
      <span class="buc-rank">#—</span>
      <span class="buc-code">B</span>
      <span class="buc-name">București</span>
      <span class="buc-score">0</span>
    </div>
  </div>

  <div class="cta-bar">SCRIE JUDEȚUL ÎN CHAT · CADOURILE SE PUN ×2</div>

  <div class="bottom-safe"></div>

</div>

<div class="gift-layer" id="giftLayer"></div>
</div>

<script src="/static/data/romania.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
